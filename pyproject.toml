[project]
name = "inference-proxy"
version = "0.1.0"
description = "Difficulty-aware AI proxy: local LM for easy tasks, account-rotating external providers for the rest"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.34",
    "httpx>=0.28",
    "pyyaml>=6.0",
    "pydantic>=2.9",
]

[project.scripts]
inference-proxy = "inference_proxy.main:run"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/inference_proxy"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
